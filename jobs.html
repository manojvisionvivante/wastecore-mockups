<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const h = (window.location.hash || '').replace('#', '');
    this.state = { t: ['assigned', 'progress', 'completed'].indexOf(h) >= 0 ? h : 'all', loading: false };
    window.addEventListener('hashchange', () => {
      const n = window.location.hash.replace('#', '');
      this.pick(['assigned', 'progress', 'completed'].indexOf(n) >= 0 ? n : 'all');
    });
  }
  pick(t) {
    this.setState({ t, loading: true });
    setTimeout(() => this.setState({ loading: false }), 700);
  }
  renderVals() {
    const S = { 'Non-compliant': 'bad', 'In progress': 'info', Compliant: 'ok', 'Pending clarification': 'warn' };
    const all = [
      ['WC-24817', 'Skip & RORO', 'Skip · C&D · Recycling', 'Northgate Builders — Holbeck Yard', 'Mark Evans', '14 Oct', '7/10', 'Non-compliant'],
      ['WC-24812', 'Hazardous Waste', 'Hazardous · Tanker', 'Kingsway Facilities — Stourton', 'Chris Hall', '14 Oct', '6/9', 'In progress'],
      ['WC-24802', 'Grab', 'Grab · Aggregates', 'Riverside Developments — Kirkstall Rd', 'Mark Evans', '14 Oct', '8/8', 'Compliant'],
      ['WC-24799', 'Skip & RORO', 'Skip', 'Northgate Builders — Kirkstall', 'Sam Pearce', '14 Oct', '9/9', 'Compliant'],
      ['WC-24795', 'Airport', 'Airport · Recycling', 'Northern Regional Airport — Gate 3', 'Amy Ross', '14 Oct', '6/6', 'Compliant'],
      ['WC-24790', 'Bulk Material', 'Tipper · Aggregates', 'Riverside Quarry — Quarry Rd', 'Ryan Cole', '14 Oct', '7/8', 'Non-compliant'],
      ['WC-24786', 'Facilities Management', 'FM · Skip', 'Kingsway Facilities — Kingsway House', 'Sam Pearce', '14 Oct', '3/6', 'In progress'],
      ['WC-24771', 'Bulk Transport', 'Walking Floor · Recycling', 'Eastside TS → Northern EfW', 'Dan Fox', '14 Oct', '5/7', 'Pending clarification'],
      ['WC-24768', 'Municipal', 'Municipal · Sweeper', 'City Council — Ward 7', 'Lee Morgan', '14 Oct', '4/7', 'In progress'],
      ['WC-24756', 'Clinical Waste', 'Clinical', 'Riverside General — Bay 3', 'Mark Evans', '14 Oct', '6/9', 'Non-compliant'],
      ['WC-24749', 'Material Recovery', 'Transfer Station · C&D', 'Eastside Transfer Station', 'Tom Hughes', '14 Oct', '5/10', 'In progress'],
      ['WC-24781', 'Tanker', 'Tanker', 'Northgate Builders — interceptor', 'Chris Hall', '13 Oct', '7/7', 'Compliant']
    ];
    const views = { all: ['All jobs', () => true], assigned: ['Assigned to me', () => false], progress: ['In progress', r => r[7] === 'In progress' || r[7] === 'Pending clarification'], completed: ['Completed', r => r[7] === 'Compliant' || r[7] === 'Non-compliant'] };
    const t = this.state.t;
    const rows = all.filter(views[t][1]);
    const loading = this.state.loading;
    return {
      tabs: Object.keys(views).map(k => ({ label: views[k][0], count: all.filter(views[k][1]).length, on: k === t ? 'true' : 'false', cls: k === t ? 'tab sel' : 'tab', pick: () => this.pick(k) })),
      loading, empty: !loading && rows.length === 0, hasRows: !loading && rows.length > 0,
      skeleton: [1, 2, 3, 4, 5], rowCount: rows.length, total: t === 'all' ? '1,284' : rows.length,
      goAll: () => this.pick('all'),
      rows: rows.map(r => ({ ref: r[0], module: r[1], tags: r[2], site: r[3], op: r[4], date: r[5], ev: r[6], status: r[7], cls: S[r[7]] }))
    };
  }
}
</script>
<script>dcBoot({});</script>
