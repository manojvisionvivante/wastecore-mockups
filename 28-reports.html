<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const B = '#1F5FD1', G = '#1F7A4D', R = '#B42318';
    const list = [
      ['Jobs by subsector', 'Counts per category tag', [['Skip', 298], ['C&D', 115], ['Aggregates', 121], ['RORO', 114], ['Recycling', 104], ['Municipal', 121], ['Transfer Station', 84], ['Walking Floor', 74]], B, 'A job with several tags counts once per tag.'],
      ['Jobs by operational module', 'One count per job', [['Skip & RORO', 412], ['Bulk Material', 236], ['Material Recovery', 188], ['Municipal', 121], ['Grab', 96], ['Bulk Transport', 74], ['Tanker', 52], ['Sweeper', 41]], B, 'Each job has exactly one primary module.'],
      ['Vehicle / equipment usage', 'Jobs per vehicle type', [['Skip loader', 298], ['Tipper', 151], ['Hook-lift', 114], ['Grab lorry', 96], ['Walking floor', 74], ['Tanker', 52]], B, 'From job assignments.'],
      ['Job completion', 'Completed vs open', [['Completed', 1032], ['In progress', 198], ['Not started', 54]], G, '80% of jobs completed in period.'],
      ['Evidence completeness', 'By module', [['Skip & RORO', 93], ['Bulk Material', 95], ['Material Recovery', 89], ['Municipal', 90], ['Clinical Waste', 84]], G, 'Percentage of required evidence validated.'],
      ['Non-compliance', 'Findings by rule', [['SW-01 permit missing', 19], ['WB-02 net weight', 14], ['PH-02 after photo', 9], ['CL-03 seal check', 4], ['LOC-01 location', 8]], R, '54 findings, 38 still open.'],
      ['Street Works', 'Triggered jobs', [['Compliant', 388], ['Missing permit', 14], ['Pending checks', 7]], G, 'Municipal is always included (mandatory).'],
      ['Hazardous & clinical', 'Classification results', [['Classified correctly', 31], ['Missing seal check', 4], ['Manifest pending', 3]], B, 'UN/ADR/EWC completeness.'],
      ['Transfer Station & Recycling', 'Tonnage in / out', [['Tonnes received', 3480], ['Tonnes recovered', 2610], ['Residual', 870]], G, 'Recovery rate 75% (sample).'],
      ['Weighbridge records', 'Validation outcome', [['Valid', 902], ['Failed', 27], ['Pending', 36]], B, 'Tolerance pending approval.'],
      ['Chain of Proof generation', 'Records issued', [['Compliant', 978], ['Non-compliant', 54]], G, 'Records are immutable once generated.']
    ];
    const i = this.state.i;
    const s = list[i];
    const max = Math.max(...s[2].map(b => b[1]));
    return {
      reports: list.map((r, k) => ({ name: r[0], desc: r[1], on: k === i ? 'true' : 'false', cls: k === i ? 'rp sel' : 'rp', pick: () => this.setState({ i: k }) })),
      sel: { name: s[0], note: s[4], bars: s[2].map(([label, value]) => ({ label, value: value.toLocaleString('en-GB') + (s[0] === 'Evidence completeness' ? '%' : ''), pct: Math.round(value / max * 100) + '%', color: s[3] })) }
    };
  }
}
</script>
