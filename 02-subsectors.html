<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const ok = ['ct', 'ws', 'ci', 'fa'];
    const h = () => { const x = window.location.hash.replace('#', ''); return ok.indexOf(x) >= 0 ? x : 'all'; };
    this.state = { dim: h() };
    window.addEventListener('hashchange', () => this.setState({ dim: h() }));
  }
  renderVals() {
    const dims = [['all', 'All'], ['ct', 'Collection & Transport'], ['ws', 'Waste & Material'], ['ci', 'Customer Industries'], ['fa', 'Waste Facilities']];
    const groups = [
      { id: 'ct', title: 'Collection & Transport', short: 'Method', hint: 'How waste is collected or moved', cls: 'info', items: [
        { name: 'Skip', desc: 'Chain-lift skips placed on site or highway, swapped or collected.', svc: 'Delivery, exchange, collection', module: 'Skip & RORO', equip: 'Skip loader', pairs: 'C&D, Recycling', jobs: 298, href: '03-category-detail.html', cta: 'View category' },
        { name: 'RORO', desc: 'Hook-lift roll-on/roll-off containers for high-volume sites.', svc: 'Container placement, exchange, haulage', module: 'Skip & RORO', equip: 'Hook-lift vehicle', pairs: 'C&D, Transfer Station', jobs: 114, href: '06-workflow.html', cta: 'Open workflow' },
        { name: 'Grab', desc: 'Grab loading of soils, aggregates and muck-away from ground or highway.', svc: 'Grab & go, muck away, aggregate supply', module: 'Grab', equip: 'Grab lorry', pairs: 'Aggregates, C&D', jobs: 96, href: '20-grab.html', cta: 'Open module' },
        { name: 'Tipper', desc: 'Loose bulk loads. Runs Bulk Material for site loading, Bulk Transport for haulage.', svc: 'Loose-load collection, haulage', module: 'Bulk Material / Bulk Transport', equip: 'Tipper', pairs: 'Aggregates, C&D', jobs: 87, href: '14-bulk-material.html', cta: 'Open module' },
        { name: 'Sweeper', desc: 'Road and vacuum sweeping across routes and public realm.', svc: 'Road, site and car-park sweeping', module: 'Sweeper', equip: 'Road / vacuum sweeper', pairs: 'Municipal', jobs: 41, href: '18-sweeper.html', cta: 'Open module' },
        { name: 'Tanker', desc: 'Liquid waste, sludge, drainage and interceptor emptying.', svc: 'Interceptor, drainage and sludge emptying', module: 'Tanker', equip: 'Vacuum tanker', pairs: 'Hazardous Waste', jobs: 52, href: '19-tanker.html', cta: 'Open module' },
        { name: 'Walking Floor', desc: 'Bulk haulage of RDF/SRF, biomass and recyclate between facilities.', svc: 'Bulk haulage between facilities', module: 'Bulk Transport', equip: 'Walking-floor trailer', pairs: 'Recycling', jobs: 74, href: '23-walking-floor.html', cta: 'Open module' }
      ]},
      { id: 'ws', title: 'Waste & Material Types', short: 'Stream', hint: 'What is being handled', cls: 'ok', items: [
        { name: 'Hazardous Waste', desc: 'Chemicals, oils, asbestos and other hazardous streams with UN/ADR/EWC data.', svc: 'Collection, classification, consignment', module: 'Hazardous Waste', equip: 'Any approved method', pairs: 'Tanker, Skip, RORO', jobs: 28, href: '13-hazardous.html', cta: 'Open module' },
        { name: 'Aggregates', desc: 'Stone, sand, soils and hardcore moved as loose bulk.', svc: 'Supply, removal, recycling', module: 'Bulk Material', equip: 'Tipper, Grab', pairs: 'Tipper, Grab', jobs: 121, href: '14-bulk-material.html', cta: 'Open module' },
        { name: 'Construction & Demolition', desc: 'Mixed C&D waste from build, refurb and demolition sites.', svc: 'Site clearance, segregation, removal', module: 'Bulk Material', equip: 'Skip, RORO, Tipper', pairs: 'Skip, Recycling', jobs: 115, href: '14-bulk-material.html', cta: 'Open module' },
        { name: 'Recycling', desc: 'Segregated recyclate sorted and processed into material outputs.', svc: 'Sorting, processing, material sales', module: 'Material Recovery', equip: 'Facility plant', pairs: 'Transfer Station, Walking Floor', jobs: 104, href: '22-recycling.html', cta: 'Open module' }
      ]},
      { id: 'ci', title: 'Customer Industries', short: 'Industry', hint: 'Where the service is delivered', cls: 'warn', items: [
        { name: 'Municipal', desc: 'Street scene, litter picking, bins and grounds. Street Works always applies.', svc: 'Street cleansing, litter, bins, grounds', module: 'Municipal', equip: 'RCV, sweeper', pairs: 'Sweeper', jobs: 121, href: '15-municipal.html', cta: 'Open module' },
        { name: 'Airport', desc: 'Airside, landside and terminal waste under airport security procedures.', svc: 'Terminal, airside and landside collections', module: 'Airport', equip: 'Airside-approved vehicle', pairs: 'Hazardous Waste', jobs: 11, href: '16-airport.html', cta: 'Open module' },
        { name: 'Facilities Management', desc: 'Internal building and external grounds waste for FM contracts.', svc: 'Internal waste, grounds, contract collections', module: 'Facilities Management', equip: 'Varies by contract', pairs: 'Skip, Recycling', jobs: 19, href: '17-facilities-management.html', cta: 'Open module' }
      ]},
      { id: 'fa', title: 'Waste Infrastructure', short: 'Facility', hint: 'Sites where waste is received', cls: 'mute', items: [
        { name: 'Transfer Station', desc: 'Receives, weighs and classifies loads before onward movement.', svc: 'Receiving, weighing, bulking, onward transfer', module: 'Material Recovery', equip: 'Weighbridge, loading shovel', pairs: 'C&D, Recycling, RORO', jobs: 84, href: '21-transfer-station.html', cta: 'Open module' }
      ]}
    ];
    const dim = this.state.dim;
    return {
      filters: dims.map(([id, label]) => ({ label, cls: id === dim ? 'btn sel' : 'btn', pick: () => this.setState({ dim: id }) })),
      groups: groups.filter(g => dim === 'all' || g.id === dim).map(g => ({ ...g, items: g.items.map(i => ({ ...i, dimCls: g.cls })) }))
    };
  }
}
</script>
