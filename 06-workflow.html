<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>

    ['Capture weighbridge/volume evidence', 'C', 'If applicable'], ['Capture completion evidence', 'M'], ['Generate chain of proof', 'M']] }
];
window.WC_RULE = { M: ['Mandatory', 'info'], C: ['Conditional', 'warn'], O: ['Optional', 'mute'], P: ['Pending clarification', 'warn'] };
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cur: 3 }; }
  renderVals() {
    const S = {
      done: { badge: 'Done', badgeCls: 'ok', dotBg: '#1F7A4D', dotFg: '#FFFFFF' },
      fail: { badge: 'Failed', badgeCls: 'bad', dotBg: '#B42318', dotFg: '#FFFFFF' },
      cur: { badge: 'Current', badgeCls: 'info', dotBg: '#1F5FD1', dotFg: '#FFFFFF' },
      todo: { badge: 'To do', badgeCls: 'mute', dotBg: '#EEF1F5', dotFg: '#4A5666' },
      opt: { badge: 'Optional', badgeCls: 'mute', dotBg: '#EEF1F5', dotFg: '#4A5666' }
    };
    const ev = (label, rule, meta, status) => ({ label, rule, meta, status, ruleCls: { Mandatory: 'info', Conditional: 'warn', Optional: 'mute' }[rule], cls: { Validated: 'ok', Missing: 'bad', Pending: 'warn', 'Not captured': 'mute' }[status] });
    const steps = [
      { title: 'Arrive on site', st: 'done', desc: 'Operator confirms arrival at the booked site.', items: [ev('Arrival timestamp', 'Mandatory', '08:39 · device clock', 'Validated')] },
      { title: 'Capture location evidence', st: 'done', desc: 'GPS position compared with the site geofence.', items: [ev('Location evidence', 'Mandatory', '±6 m · inside geofence', 'Validated')] },
      { title: 'Confirm waste type', st: 'done', desc: 'Declared waste type confirmed against what is on site.', items: [ev('Waste type confirmation', 'Mandatory', 'Mixed C&D · EWC 17 09 04', 'Validated')] },
      { title: 'Capture Street Works evidence', st: 'fail', desc: 'The skip sits on a public highway, so Street Works applies. Permit, safety zone and vehicle positioning are required before the container is moved.', items: [ev('Street Works permit', 'Conditional', 'No permit reference entered', 'Missing'), ev('Safety zone evidence', 'Conditional', 'Cones and signage photo · 08:47', 'Validated'), ev('Vehicle positioning evidence', 'Conditional', 'Photo · 08:48', 'Validated'), ev('Traffic management', 'Conditional', 'Required only if the permit says so', 'Pending')], fb: ['bad', 'Rule SW-01 failed: permit missing', 'Non-compliance NC-1093 has been raised and sent to the operator and depot manager. It will appear in the Chain of Proof.'] },
      { title: 'Drop or collect container', st: 'done', desc: 'Skip collected from site.', items: [ev('Container action', 'Mandatory', 'Collection · 08:58', 'Validated')] },
      { title: 'Capture before/after photos', st: 'done', desc: 'Site condition before and after the collection.', items: [ev('Before photo', 'Mandatory', '08:44', 'Validated'), ev('After photo', 'Mandatory', '09:03', 'Validated')] },
      { title: 'Capture load integrity photos', st: 'done', desc: 'Collections only: load secured and not overfilled.', items: [ev('Load integrity photo', 'Conditional', 'Collection → required · 08:58', 'Validated')] },
      { title: 'Capture contamination evidence', st: 'done', desc: 'Record any contamination observed in the load.', items: [ev('Contamination evidence', 'Mandatory', 'None observed · 09:01', 'Validated')] },
      { title: 'Capture weighbridge ticket', st: 'cur', desc: 'Upload the ticket from the receiving facility. Net weight is checked against gross and tare.', items: [ev('Weighbridge ticket', 'Mandatory', 'Awaiting upload at Eastside Transfer Station', 'Missing')], fb: ['warn', 'Waiting for the weighbridge ticket', 'Tolerance for the weight check is not yet defined in the PDF and is marked pending clarification.'] },
      { title: 'Capture customer signature', st: 'opt', desc: 'Optional in v2.0 (mandatory in v1.0 — using v2.0).', items: [ev('Customer signature', 'Optional', 'Not captured', 'Not captured')] },
      { title: 'Capture completion evidence', st: 'todo', desc: 'Final confirmation that the job is complete.', items: [ev('Completion evidence', 'Mandatory', 'Not started', 'Pending')] },
      { title: 'Generate Chain of Proof', st: 'todo', desc: 'Runs the four completion checks and builds the audit record.', items: [ev('Completion checks', 'Mandatory', 'Evidence · workflow · intelligence · chain of proof', 'Pending')] }
    ];
    const cur = this.state.cur;
    const tones = { bad: ['#FFF8F7', '#F3C4BF'], warn: ['#FFFAEE', '#F0D9A4'] };
    const mapped = steps.map((s, i) => ({ ...s, ...S[s.st], n: i + 1, cls: i === cur ? 'step cur' : 'step', current: i === cur ? 'step' : 'false', pick: () => this.setState({ cur: i }) }));
    const sel = mapped[cur];
    return {
      steps: mapped,
      sel: { ...sel, hasFeedback: !!sel.fb, fbTitle: sel.fb ? sel.fb[1] : '', fbText: sel.fb ? sel.fb[2] : '', fbBg: sel.fb ? tones[sel.fb[0]][0] : '#fff', fbBorder: sel.fb ? tones[sel.fb[0]][1] : '#fff', next: cur < 11 ? 'Save and go to step ' + (cur + 2) : 'Generate Chain of Proof' }
    };
  }
}
</script>
<script>dcBoot({});</script>
