<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'All', read: false }; }
  renderVals() {
    const all = [
      ['Missing permit', 'Street Works permit missing on WC-24817', 'Skip on public highway without permit. NC-1093 raised.', 'WC-24817', '12 min', 'Failure', 'bad', '26-non-compliance.html', true],
      ['Failed validation', 'Weighbridge net weight mismatch', 'WB-02 failed on ticket ES-557930.', 'WC-24790', '48 min', 'Failure', 'bad', '11-weighbridge.html', true],
      ['Missing evidence', 'Seal check not recorded', 'Clinical containers collected without seal check.', 'WC-24756', '3 h', 'Failure', 'bad', '24-clinical.html', true],
      ['Pending', 'Walking Floor rule needs a decision', 'Route and manifest rules are pending clarification.', 'WC-24771', '2 h', 'Action needed', 'warn', '23-walking-floor.html', true],
      ['Missing classification', 'EWC code awaiting confirmation', 'Supervisor to confirm 17 09 04.', 'WC-24749', '5 h', 'Action needed', 'warn', '21-transfer-station.html', true],
      ['Missing weighbridge', 'Weighbridge record missing', 'No ticket received from Northern EfW Plant for the walking-floor load.', 'WC-24771', '1 h', 'Failure', 'bad', '11-weighbridge.html', true],
      ['Waste mismatch', 'Waste type differs from booking', 'Booked as soil, photographed as mixed C&D.', 'WC-24744', 'Yesterday', 'Action needed', 'warn', '09-photo-contamination.html', false],
      ['Incomplete workflow', 'After photo outstanding', 'Municipal route still missing after photo.', 'WC-24768', 'Yesterday', 'Reminder', 'info', '15-municipal.html', false],
      ['Non-compliance update', 'NC-1077 resolved', 'After photo uploaded and accepted.', 'NC-1077', 'Yesterday', 'Update', 'ok', '26-non-compliance.html', false],
      ['Job completed', 'WC-24802 completed', 'All four completion checks passed.', 'WC-24802', 'Yesterday', 'Update', 'ok', '05-job-details.html', false],
      ['Chain of Proof', 'Chain of Proof ready', 'CoP-2026-10-0412 generated and hashed.', 'CoP-0412', 'Yesterday', 'Update', 'ok', '27-chain-of-proof.html', false]
    ];
    const groups = { All: null, Failures: 'Failure', 'Action needed': 'Action needed', Updates: 'Update' };
    const f = this.state.f, read = this.state.read;
    const dot = { bad: '#B42318', warn: '#B7791F', info: '#1F5FD1', ok: '#1F7A4D' };
    return {
      readAll: () => this.setState({ read: true }),
      filters: Object.keys(groups).map(x => ({ label: x, on: x === f ? 'true' : 'false', cls: x === f ? 'btn sel' : 'btn', pick: () => this.setState({ f: x }) })),
      items: all.filter(n => !groups[f] || n[5] === groups[f]).map(n => ({ title: n[1], text: n[2], ref: n[3], when: n[4], kind: n[5], cls: n[6], href: n[7], dot: (n[8] && !read) ? dot[n[6]] : '#C4CDD8', bg: (n[8] && !read) ? '#FFFFFF' : '#F8FAFC' }))
    };
  }
}
</script>
<script>dcBoot({});</script>
