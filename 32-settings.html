a{color:#1F5FD1}a:hover{color:#174AA6}

.side{flex:1 1 240px;background:#0F1E36;padding:20px 12px;box-sizing:border-box}

</form>

<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 'cats' }; }
  renderVals() {
    const tabs = [['cats', 'Categories & mapping'], ['evidence', 'Evidence rules'], ['thresholds', 'Thresholds'], ['roles', 'Roles & permissions'], ['audit', 'Audit history']];
    const t = this.state.t;
    const show = {}; tabs.forEach(([k]) => show[k] = k === t);
    const cats = [
      ['Skip', 'Collection & Transport', 'Skip & RORO', 'C&D, Recycling'], ['RORO', 'Collection & Transport', 'Skip & RORO', 'C&D, Transfer Station'],
      ['Grab', 'Collection & Transport', 'Grab', 'Aggregates, C&D'], ['Tipper', 'Collection & Transport', 'Bulk Material / Bulk Transport', 'Aggregates, C&D'],
      ['Sweeper', 'Collection & Transport', 'Sweeper', 'Municipal'], ['Tanker', 'Collection & Transport', 'Tanker', 'Hazardous Waste'],
      ['Walking Floor', 'Collection & Transport', 'Bulk Transport', 'Recycling'], ['Hazardous Waste', 'Waste & Material', 'Hazardous Waste', 'Tanker, Skip, RORO'],
      ['Aggregates', 'Waste & Material', 'Bulk Material', 'Tipper, Grab'], ['C&D', 'Waste & Material', 'Bulk Material', 'Skip, Recycling'],
      ['Recycling', 'Waste & Material', 'Material Recovery', 'Transfer Station, Walking Floor'], ['Municipal', 'Customer Industry', 'Municipal', 'Sweeper'],
      ['Airport', 'Customer Industry', 'Airport', 'Hazardous Waste'], ['Facilities Management', 'Customer Industry', 'Facilities Management', 'Skip, Recycling'],
      ['Transfer Station', 'Waste Facility', 'Material Recovery', 'C&D, Recycling, RORO']
    ].map(([name, dim, module, rel]) => ({ name, dim, module, rel }));
    const cols = ['Skip & RORO', 'Grab', 'Sweeper', 'Tanker', 'Hazardous', 'Bulk Material', 'Municipal', 'Material Rec.', 'Bulk Transport', 'Clinical'];
    const CC = { M: ['info', 'Mandatory'], C: ['warn', 'Conditional'], O: ['mute', 'Optional'], X: ['mute', 'Excluded'], '?': ['warn', 'Pending clarification'] };
    const mx = [
      ['Job sheet', 'MMMMMMMMMM'], ['Location evidence', 'MMMMMMMMMM'], ['Waste type confirmation', 'MMMMMMMMMM'],
      ['Street Works evidence', 'CCCCCCMXCC'], ['Before/after photos', 'MXMXXXMXXX'], ['Load / load integrity photos', 'CMXXXMXMMX'],
      ['Contamination evidence', 'MMXMMMXMMC'], ['Weighbridge ticket', 'MMXCCMXMMC'], ['Seal checks', 'XXXXMXXX?M'],
      ['Manifest / consignment note', 'XXXXMXXX?M'], ['Route evidence', 'XXMXXXMX?X'], ['Customer signature', 'OXXXXXXXXX']
    ];
    const roleRows = [
      ['Capture evidence', 'YYYNN'], ['Complete workflow steps', 'YYNNN'], ['Resolve non-compliance', 'NYYYN'],
      ['Approve thresholds / rule changes', 'NNNYN'], ['Edit categories & mappings', 'NNNYN'], ['View hazardous & clinical records', 'NYYYY'], ['Export Chain of Proof', 'NYYYY']
    ];
    return {
      tabs: tabs.map(([k, label]) => ({ label, on: k === t ? 'true' : 'false', cls: k === t ? 'tab sel' : 'tab', pick: () => this.setState({ t: k }) })),
      show, cats, modCols: cols,
      matrix: mx.map(([name, s]) => ({ name, cells: s.split('').map(v => ({ v, cls: CC[v][0], title: CC[v][1] })) })),
      roles: roleRows.map(([name, s]) => ({ name, cells: s.split('').map(v => ({ v: v === 'Y' ? 'Allowed' : '—', cls: v === 'Y' ? 'ok' : 'mute' })) })),
      audit: [
        { when: '14 Oct 2026 09:30', text: 'Priya Shah submitted weighbridge tolerance for approval (pending).' },
        { when: '10 Oct 2026 15:12', text: 'Sarah Collins changed Skip customer signature from Mandatory to Optional (v2.0).' },
        { when: '08 Oct 2026 11:04', text: 'Walking Floor route/manifest/seal rules set to Pending clarification.' },
        { when: '01 Oct 2026 09:00', text: 'Module configuration imported from WASTE SECTOR v2.0.' }
      ]
    };
  }
}
</script>
<script>dcBoot({});</script>
