<script>
(function(){
var handlers=[],comp,root,TPL;
function get(scope,path){path=path.trim();if(path==='true')return true;if(path==='false')return false;
 if(/^-?\d+(\.\d+)?$/.test(path))return +path;var v=scope,ks=path.split('.');
 for(var i=0;i<ks.length;i++){if(v==null)return undefined;v=v[ks[i]];}return v;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function holes(t,scope){
 t=t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g,function(m,ev,p){var f=get(scope,p);
  if(typeof f!=='function')return '';handlers.push(f);return 'data-dc-'+ev.toLowerCase()+'="'+(handlers.length-1)+'"';});
 return t.replace(/\{\{([^}]+)\}\}/g,function(m,p){var v=get(scope,p);return v==null?'':esc(v);});}
var OPEN=/<(sc-for|sc-if)\b([^>]*)>/;
function findClose(t,tag,from){var depth=1,i=from,o=new RegExp('<'+tag+'\\b','g'),c=new RegExp('</'+tag+'>','g');
 while(true){o.lastIndex=i;c.lastIndex=i;var mo=o.exec(t),mc=c.exec(t);if(!mc)throw new Error('unclosed '+tag);
  if(mo&&mo.index<mc.index){depth++;i=mo.index+1;}else{depth--;i=mc.index+mc[0].length;if(depth===0)return [mc.index,i];}}}
function attr(a,name){var m=a.match(new RegExp(name+'="\\{\\{([^}]+)\\}\\}"'))||a.match(new RegExp(name+'="([^"]*)"'));return m?m[1]:null;}
function render(t,scope){var out='';while(true){var m=OPEN.exec(t);if(!m){return out+holes(t,scope);}
 out+=holes(t.slice(0,m.index),scope);var start=m.index+m[0].length,r=findClose(t,m[1],start),inner=t.slice(start,r[0]);
 if(m[1]==='sc-for'){var list=get(scope,attr(m[2],'list'))||[],as=attr(m[2],'as')||'item';
  for(var i=0;i<list.length;i++){var s=Object.create(scope);s[as]=list[i];s.$index=i;out+=render(inner,s);}}
 else if(get(scope,attr(m[2],'value'))){out+=render(inner,scope);}
 t=t.slice(r[1]);}}
function draw(){handlers.length=0;root.innerHTML=render(TPL,comp.renderVals());}
window.DCLogic=function(props){this.props=props||{};this.state={};};
DCLogic.prototype.setState=function(p){Object.assign(this.state,typeof p==='function'?p(this.state):p);draw();};
DCLogic.prototype.forceUpdate=function(){draw();};
window.dcBoot=function(){root=document.getElementById('dc-root');TPL=document.getElementById('dc-tpl').textContent;
 comp=new Component({});draw();
 root.addEventListener('click',function(e){var el=e.target.closest('[data-dc-click]');
  if(el){e.preventDefault();handlers[+el.getAttribute('data-dc-click')](e);}});};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'pending', unload: false }; }
  renderVals() {
    const mode = this.state.mode;
    const now = {
      pending: ['Pending clarification', 'warn'],
      v1: ['Mandatory', 'info'],
      v2: ['Excluded', 'mute']
    }[mode];
    const conflicts = [
      { req: 'Route evidence', v1: 'Required', v2: 'Excluded' },
      { req: 'Bulk transport manifest', v1: 'Required', v2: 'Excluded (unless hazardous)' },
      { req: 'Seal check', v1: 'Required if applicable', v2: 'Excluded' }
    ].map(c => ({ ...c, now: now[0], cls: now[1] }));
    const choices = [
      ['pending', 'Keep pending (default)', 'Shown as unresolved. Does not block completion; flagged in Chain of Proof.'],
      ['v1', 'Apply v1.0 Walking Floor rules', 'Route, manifest and seal check become mandatory for walking floor jobs.'],
      ['v2', 'Apply v2.0 Bulk Transport rules', 'Route, manifest and seal check are excluded, manifest only if hazardous.']
    ].map(([id, title, desc]) => ({ title, desc, checked: id === mode ? 'true' : 'false', cls: id === mode ? 'opt sel' : 'opt', pick: () => this.setState({ mode: id }) }));
    const u = this.state.unload;
    const ev = [
      ['Job sheet', 'Validated', 'ok'], ['Location evidence', 'Validated', 'ok'], ['Waste/material type', 'Validated', 'ok'],
      ['Load integrity photos', 'Validated', 'ok'], ['Contamination evidence', 'Validated', 'ok'], ['Weighbridge ticket', 'Missing', 'bad'],
      ['Unloading evidence', u ? 'Required' : 'Off', u ? 'info' : 'mute'], ['Completion evidence', 'To do', 'mute'],
      ['Route evidence', now[0], now[1]], ['Bulk transport manifest', now[0], now[1]]
    ].map(([label, state, cls]) => ({ label, state, cls }));
    return {
      conflicts, choices, evidence: ev,
      unloadOn: u ? 'true' : 'false', trackBg: u ? '#1F5FD1' : '#8D9AAB', knobLeft: u ? '21px' : '3px',
      unloadText: u ? 'Unloading photos will be required at the destination.' : 'Optional toggle from v2.0 — off for this job.',
      toggleUnload: () => this.setState({ unload: !u })
    };
  }
}

DCLogic.prototype.constructor = DCLogic;</script>
<script>dcBoot();</script>
</body>
