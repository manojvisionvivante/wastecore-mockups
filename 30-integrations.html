<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>

<script>
class Component extends DCLogic {
  renderVals() {
    const C = { Configured: 'ok', Disconnected: 'bad', Unavailable: 'mute', 'Planned only': 'info' };
    const items = [
      ['Weighbridge API', 'Configured', 'Pulls tickets from the Eastside weighbridge and matches them to jobs by vehicle and time.', 'Skip & RORO, Bulk Material, Material Recovery, Grab', '14 Oct 2026, 11:40', 'Configure'],
      ['Route tracking', 'Disconnected', 'Vehicle GPS traces for Sweeper, Municipal and Bulk Transport route evidence.', 'Sweeper, Municipal, Bulk Transport', 'Failed 14 Oct 2026, 06:00', 'Reconnect'],
      ['DEFRA Digital Waste Tracking', 'Planned only', 'Submit waste movements to the national digital waste tracking service when it becomes available.', 'All modules', '—', 'View plan'],
      ['Digital Waste Transfer Notes', 'Planned only', 'Generate and exchange electronic waste transfer notes.', 'All collection modules', '—', 'View plan'],
      ['Hazardous / clinical manifest', 'Planned only', 'Exchange consignment notes with treatment facilities.', 'Hazardous Waste, Clinical Waste, Tanker', '—', 'View plan'],
      ['Waste / material classification', 'Unavailable', 'EWC suggestion service. Not available in Phase 1; codes are entered and confirmed by staff.', 'Material Recovery, Hazardous Waste', '—', 'Details'],
      ['Man & Van (Phase 2)', 'Planned only', 'Mobile app support for Man & Van collections. Excluded from Phase 1 by the Waste Sector pack.', 'Man & Van (future module)', '—', 'View plan'],
      ['Contamination & load-integrity AI', 'Planned only', 'Automated photo checks. Outside Phase 1 unless separately approved.', 'Skip & RORO, Bulk Transport, Material Recovery', '—', 'View plan']
    ];
    return { items: items.map(([name, status, desc, used, sync, action]) => ({ name, status, desc, used, sync, action, cls: C[status] })) };
  }
}
</script>
