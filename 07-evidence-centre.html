<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 'All', i: 0 }; }
  renderVals() {
    const S = { Verified: 'ok', Pending: 'warn', Rejected: 'bad' };
    const all = [
      ['EV-88412', 'Placement photo', 'WC-24817', 'Mark Evans', '14 Oct 08:47', 'Verified', 'Photo', 'Skip on highway with cones', 'iPhone 13 · app 2.4', '53.79, -1.56 (±6 m)', '9c1e…44ab', 'Shows skip position and safety zone.'],
      ['EV-88411', 'Street Works permit', 'WC-24817', '—', '—', 'Pending', 'Permit', 'No document uploaded', '—', '—', '—', 'Required because the skip sits on a public highway.'],
      ['EV-88409', 'Contamination evidence', 'WC-24817', 'Mark Evans', '14 Oct 09:01', 'Verified', 'Photo', 'Load surface, no contaminants', 'iPhone 13 · app 2.4', '53.79, -1.56 (±5 m)', 'e44f…0a9d', 'Operator note: none observed.'],
      ['EV-88401', 'GPS location', 'WC-24817', 'Device', '14 Oct 08:41', 'Verified', 'GPS', 'Map pin inside site geofence', 'iPhone 13 · app 2.4', '53.79, -1.56 (±6 m)', '71bd…c802', '18 m from site centre.'],
      ['EV-88390', 'Weighbridge ticket', 'WC-24790', 'Dev Kumar', '14 Oct 08:49', 'Rejected', 'Weighbridge', 'Ticket ES-557930 scan', 'Office scanner', 'Eastside TS', '19ce…e036', 'Net weight does not equal gross minus tare.'],
      ['EV-88350', 'EWC classification', 'WC-24749', 'Tom Hughes', '14 Oct 07:12', 'Pending', 'Classification', 'EWC 19 12 12 entry', 'Web', 'Eastside TS', 'b2a7…915f', 'Awaiting supervisor confirmation.'],
      ['EV-88322', 'Load photos', 'WC-24802', 'Mark Evans', '14 Oct 10:58', 'Verified', 'Photo', 'Grab lorry load, 2 photos', 'Android · app 2.4', '53.80, -1.58 (±4 m)', 'a4b9…27c0', 'Added to resolve NC-1069.'],
      ['EV-88319', 'Weighbridge ticket', 'WC-24802', 'Eastside TS', '14 Oct 10:47', 'Verified', 'Weighbridge', 'Ticket ES-558201 scan', 'Weighbridge API', 'Eastside TS', '2fa0…8e71', 'Net 12.74 t matches gross minus tare.'],
      ['EV-88277', 'Consignment note', 'WC-24756', 'Mark Evans', '14 Oct 06:38', 'Verified', 'Manifest', 'Clinical consignment note PDF', 'Android · app 2.4', 'Riverside General', '5d03…e1c2', 'Seal check is still missing for this job.'],
      ['EV-88260', 'Customer signature', 'WC-24741', 'Customer', '13 Oct 16:05', 'Verified', 'Signature', 'Signature capture', 'iPhone 13 · app 2.4', '53.81, -1.52 (±8 m)', '0e88…7d4b', 'Optional item captured.']
    ];
    const types = ['All', 'Photo', 'GPS', 'Weighbridge', 'Permit', 'Manifest', 'Classification', 'Signature'];
    const t = this.state.t;
    const rows = all.filter(r => t === 'All' || r[6] === t);
    const i = Math.min(this.state.i, rows.length - 1);
    const toObj = (r) => ({ ref: r[0], type: r[1], job: r[2], by: r[3], when: r[4], status: r[5], cls: S[r[5]], preview: r[7], device: r[8], loc: r[9], hash: r[10], note: r[11] });
    return {
      chips: types.map(x => ({ label: x, count: x === 'All' ? all.length : all.filter(r => r[6] === x).length, on: x === t ? 'true' : 'false', cls: x === t ? 'chip sel' : 'chip', pick: () => this.setState({ t: x, i: 0 }) })),
      rows: rows.map((r, k) => ({ ...toObj(r), rowCls: k === i ? 'erow sel' : 'erow', pick: () => this.setState({ i: k }) })),
      shown: rows.length,
      sel: rows.length ? toObj(rows[i]) : toObj(['—', 'No evidence', '—', '—', '—', 'Pending', '', 'Nothing selected', '—', '—', '—', ''])
    };
  }
}
</script>
<script>dcBoot({});</script>
