<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const R = { Pass: 'ok', Fail: 'bad', Pending: 'warn', 'N/A': 'mute' };
    const ck = (rows) => rows.map(([name, detail, result]) => ({ name, detail, result, cls: R[result] }));
    const list = [
      { job: 'WC-24817', module: 'Skip & RORO', loc: 'Holbeck Yard, LS11 9XX', status: 'Non-compliant', permit: '—', valid: '—', pstatus: 'Not provided', why: 'Conditional — skip on public highway', nc: 'NC-1093',
        checks: ck([['Permit', 'No permit reference or document', 'Fail'], ['Traffic management', 'Only if the permit requires it', 'Pending'], ['Safety zone evidence', 'Photo EV-88412 · 08:47', 'Pass'], ['Vehicle positioning', 'Photo EV-88413 · 08:48', 'Pass'], ['Before/after photos', 'EV-88402, EV-88410', 'Pass']]) },
      { job: 'WC-24768', module: 'Municipal', loc: 'Ward 7 — High Street route', status: 'In progress', permit: 'SW-2026-48102', valid: '14–16 Oct 2026', pstatus: 'Active', why: 'Mandatory — Municipal module', nc: '',
        checks: ck([['Permit', 'SW-2026-48102 valid today', 'Pass'], ['Traffic management', 'Chapter 8 signage photo', 'Pass'], ['Safety zone evidence', 'Photo · 06:40', 'Pass'], ['Vehicle positioning', 'Photo · 06:42', 'Pass'], ['Route compliance', 'GPS trace 82% complete', 'Pending'], ['Before/after photos', 'After photo not yet taken', 'Pending']]) },
      { job: 'WC-24802', module: 'Grab', loc: 'Kirkstall Road, LS4 2XX', status: 'Compliant', permit: 'SW-2026-48213', valid: '14 Oct 2026', pstatus: 'Active', why: 'Conditional — loading from highway', nc: '',
        checks: ck([['Permit', 'Valid for date and location', 'Pass'], ['Traffic management', 'Not required by permit', 'N/A'], ['Safety zone evidence', 'Photo · 09:34', 'Pass'], ['Vehicle positioning', 'Photo · 09:35', 'Pass'], ['Before/after photos', '2 photos', 'Pass']]) },
      { job: 'WC-24799', module: 'Skip & RORO', loc: 'Private yard, Kirkstall', status: 'Not applicable', permit: '—', valid: '—', pstatus: '—', why: 'Placement on private land', nc: '',
        checks: ck([['Street Works', 'Not triggered for private land', 'N/A']]) }
    ];
    const S = { 'Non-compliant': 'bad', 'In progress': 'info', Compliant: 'ok', 'Not applicable': 'mute' };
    const i = this.state.i;
    const s = list[i];
    return {
      jobs: list.map((j, k) => ({ ...j, stCls: S[j.status], on: k === i ? 'true' : 'false', cls: k === i ? 'prow sel' : 'prow', pick: () => this.setState({ i: k }) })),
      s: { ...s, stCls: S[s.status], hasNc: !!s.nc }
    };
  }
}
</script>
<script>dcBoot({});</script>
