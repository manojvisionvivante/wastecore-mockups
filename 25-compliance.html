<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all' }; }
  renderVals() {
    const cats = [
      ['Evidence completeness', 1180, 61, 9], ['Workflow completeness', 1204, 38, 0], ['Location validation', 1222, 14, 48],
      ['Waste/material type', 1236, 22, 3], ['Contamination', 1198, 9, 41], ['Weighbridge / volume', 902, 27, 36],
      ['EWC / UN / ADR', 214, 6, 11], ['Street Works', 388, 19, 2]
    ].map(([name, pass, fail, pending]) => ({ name, pass, fail, pending }));
    const C = { Pass: 'ok', Fail: 'bad', Pending: 'warn', 'Not applicable': 'mute' };
    const all = [
      ['SW-01', 'Street Works permit present', 'Fail', 'Skip placed on public highway; no permit reference on the job.', 'EV-88412 (placement)', 'WC-24817', '09:06', 'Add permit reference and upload permit.'],
      ['WB-02', 'Net weight = gross − tare', 'Fail', 'Ticket net 7.42 t, calculated 6.98 t. Difference above tolerance.', 'EV-88390 (ticket)', 'WC-24790', '08:51', 'Re-capture ticket or correct tare.'],
      ['LOC-01', 'Captured location inside site geofence', 'Pass', 'GPS fix ±6 m, 18 m from site centre.', 'EV-88401 (GPS)', 'WC-24817', '08:41', '—'],
      ['WT-01', 'Declared waste type matches evidence', 'Pass', 'Declared Mixed C&D; operator confirmation and photo agree.', 'EV-88403, EV-88405', 'WC-24817', '08:45', '—'],
      ['CT-01', 'Contamination evidence recorded', 'Pass', 'Contamination check completed with photo.', 'EV-88409', 'WC-24817', '09:01', '—'],
      ['WF-BT-02', 'Route evidence present', 'Pending', 'Requirement under v1/v2 conflict review.', '—', 'WC-24771', '07:58', 'Await approved interpretation.'],
      ['CL-03', 'Container seal check recorded', 'Fail', 'Clinical containers collected without seal check.', 'EV-88277', 'WC-24756', '06:40', 'Record seal check before dispatch.'],
      ['MR-04', 'EWC classification confirmed', 'Pending', 'EWC code entered, awaiting supervisor confirmation.', 'EV-88350', 'WC-24749', '07:12', 'Supervisor to confirm code.'],
      ['SW-01', 'Street Works permit present', 'Not applicable', 'Placement on private land.', 'EV-88330', 'WC-24802', '14 Oct', '—'],
      ['WB-01', 'Weighbridge ticket present', 'Pass', 'Ticket uploaded and matched to vehicle registration.', 'EV-88319', 'WC-24802', '14 Oct', '—']
    ].map(([id, name, outcome, why, ev, job, when, fix]) => ({ id, name, outcome, why, ev, job, when, fix, cls: C[outcome] }));
    const f = this.state.f;
    const map = { all: null, fail: 'Fail', pending: 'Pending', pass: 'Pass', na: 'Not applicable' };
    return {
      cats,
      rows: all.filter(r => !map[f] || r.outcome === map[f]),
      filters: [['all', 'All'], ['fail', 'Failed'], ['pending', 'Pending'], ['pass', 'Passed'], ['na', 'Not applicable']].map(([id, label]) => ({ label, on: id === f ? 'true' : 'false', cls: id === f ? 'btn sel' : 'btn', pick: () => this.setState({ f: id }) }))
    };
  }
}
</script>
<script>dcBoot({});</script>
