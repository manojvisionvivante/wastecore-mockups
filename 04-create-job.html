<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mod: 'skip', tags: { Skip: true, 'C&D': true, Recycling: true }, stage: 0 };

  renderVals() {
    const M = 'Mandatory', C = 'Conditional', O = 'Optional', X = 'Excluded';
    const cls = { Mandatory: 'info', Conditional: 'warn', Optional: 'mute', Excluded: 'mute' };
    const ev = (pairs) => pairs.map(([label, state]) => ({ label, state, cls: cls[state] }));
    const defs = {
      skip: { name: 'Skip & RORO', covers: 'Skip, RORO', streetWorks: 'Conditional — public highway placement', note: 'Container type is a parameter. Load integrity photos apply to collections.', evidence: ev([['Job sheet', M], ['Location evidence', M], ['Waste type confirmation', M], ['Street Works evidence', C], ['Before/after photos', M], ['Load integrity photos', C], ['Contamination evidence', M], ['Weighbridge ticket', M], ['Customer signature', O], ['Completion evidence', M], ['Seal checks', X]]) },
      grab: { name: 'Grab', covers: 'Grab', streetWorks: 'Conditional', note: 'Soils, aggregates and muck away.', evidence: ev([['Job sheet', M], ['Location evidence', M], ['Material/waste type', M], ['Load photos', M], ['Contamination evidence', M], ['Street Works evidence', C], ['Weighbridge ticket', M], ['Completion evidence', M], ['Customer signature', X]]) },
      sweeper: { name: 'Sweeper', covers: 'Sweeper', streetWorks: 'Conditional', note: 'Route-based sweeping work.', evidence: ev([['Job sheet', M], ['Route evidence', M], ['Location evidence', M], ['Street Works evidence', C], ['Before/after photos', M], ['Waste type confirmation', M], ['Completion evidence', M], ['Weighbridge ticket', X]]) },
      tanker: { name: 'Tanker', covers: 'Tanker', streetWorks: 'Conditional', note: 'Liquid waste, sludge, drainage, interceptors.', evidence: ev([['Job sheet', M], ['Location evidence', M], ['Waste type (liquid/sludge)', M], ['Contamination evidence', M], ['Load volume evidence', M], ['Weighbridge / volume ticket', C], ['Completion evidence', M], ['Load photos', X]]) },
      haz: { name: 'Hazardous Waste', covers: 'Hazardous', streetWorks: 'Conditional', note: 'Full legal compliance stream.', evidence: ev([['Job sheet', M], ['Location evidence', M], ['Hazard classification (UN/ADR/EWC)', M], ['Waste type confirmation', M], ['Contamination evidence', M], ['Seal checks', M], ['Manifest / consignment note', M], ['Weighbridge ticket', C], ['Completion evidence', M]]) },
      bulkm: { name: 'Bulk Material', covers: 'Aggregates, C&D, Tipper', streetWorks: 'Conditional', note: 'Loose bulk material loading.', evidence: ev([['Job sheet', M], ['Location evidence', M], ['Material/waste type', M], ['Load photos', M], ['Contamination evidence', M], ['Weighbridge ticket', M], ['Completion evidence', M], ['Seal checks', X]]) },
      muni: { name: 'Municipal', covers: 'Municipal', streetWorks: 'Mandatory on every job', note: 'Public highways and public-risk zones.', evidence: ev([['Job sheet', M], ['Route evidence', M], ['Location evidence', M], ['Street Works evidence', M], ['Waste/material type', M], ['Before/after photos', M], ['Completion evidence', M], ['Weighbridge ticket', X]]) },
      air: { name: 'Airport', covers: 'Airport', streetWorks: 'Conditional — landside public roads', note: 'Follows the operator’s approved security procedures.', evidence: ev([['Job sheet', M], ['Location evidence', M], ['Waste type confirmation', M], ['Security compliance evidence', M], ['Contamination evidence', M], ['Completion evidence', M], ['Weighbridge ticket', X]]) },
      fm: { name: 'Facilities Management', covers: 'FM', streetWorks: 'Conditional — external work', note: 'Internal building and external grounds waste.', evidence: ev([['Job sheet', M], ['Location evidence', M], ['Waste type confirmation', M], ['Before/after photos', M], ['Contamination evidence', M], ['Street Works evidence', C], ['Completion evidence', M]]) },

      ['Customer Industries', ['Municipal', 'Airport', 'FM']],
      ['Waste Infrastructure', ['Transfer Station']]

      const on = !!this.state.tags[name];

    const stage = this.state.stage;

      tagsText, evCount: defs[mod].evidence.filter(e => e.state !== 'Excluded').length,
      tagGroups,
      steps: labels.map((label, i) => {
        const ranges = [[0, 3], [3, 7], [7, 8], [8, 9], [9, 9]];
        const [a, b] = ranges[stage];

        const done = i < a;
