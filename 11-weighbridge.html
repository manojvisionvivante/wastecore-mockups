<script>// Minimal renderer for the prototype's .dc templates: {{holes}}, <sc-for>, <sc-if>,
// onX="{{handler}}" events, and a DCLogic base class with setState.
(function () {
  var handlers = [], comp, root, TPL;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var v = scope, ks = path.split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return undefined; v = v[ks[i]]; }
    return v;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function holes(t, scope) {
    t = t.replace(/\bon([A-Z]\w*)="\{\{([^}]+)\}\}"/g, function (m, ev, p) {
      var f = get(scope, p);
      if (typeof f !== 'function') return '';
      handlers.push(f);
      return 'data-dc-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    return t.replace(/\{\{([^}]+)\}\}/g, function (m, p) { var v = get(scope, p); return v == null ? '' : esc(v); });
  }
  var OPEN = /<(sc-for|sc-if)\b([^>]*)>/;
  function findClose(t, tag, from) {
    var depth = 1, i = from, o = new RegExp('<' + tag + '\\b', 'g'), c = new RegExp('</' + tag + '>', 'g');
    while (true) {
      o.lastIndex = i; c.lastIndex = i;
      var mo = o.exec(t), mc = c.exec(t);
      if (!mc) throw new Error('unclosed ' + tag);
      if (mo && mo.index < mc.index) { depth++; i = mo.index + 1; }
      else { depth--; i = mc.index + mc[0].length; if (depth === 0) return [mc.index, i]; }
    }
  }
  function attr(a, name) {
    var m = a.match(new RegExp(name + '="\\{\\{([^}]+)\\}\\}"')) || a.match(new RegExp(name + '="([^"]*)"'));
    return m ? m[1] : null;
  }
  function render(t, scope) {
    var out = '';
    while (true) {
      var m = OPEN.exec(t);
      if (!m) return out + holes(t, scope);
      out += holes(t.slice(0, m.index), scope);
      var start = m.index + m[0].length, r = findClose(t, m[1], start), inner = t.slice(start, r[0]);
      if (m[1] === 'sc-for') {
        var list = get(scope, attr(m[2], 'list')) || [], as = attr(m[2], 'as') || 'item';
        for (var i = 0; i < list.length; i++) {
          var s = Object.create(scope); s[as] = list[i]; s.$index = i; out += render(inner, s);
        }
      } else if (get(scope, attr(m[2], 'value'))) {
        out += render(inner, scope);
      }
      t = t.slice(r[1]);
    }
  }
  function draw() {
    handlers.length = 0;
    var y = window.scrollY;
    root.innerHTML = render(TPL, comp.renderVals());
    window.scrollTo(0, y);
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  DCLogic.prototype.setState = function (p) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); draw();
  };
  DCLogic.prototype.forceUpdate = function () { draw(); };
  window.dcBoot = function (props) {
    root = document.getElementById('dc-root');
    TPL = document.getElementById('dc-tpl').textContent;
    comp = new Component(props || {});
    draw();
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-dc-click]');
      if (el) { e.preventDefault(); handlers[+el.getAttribute('data-dc-click')](e); }
    });
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'All', imp: 'idle', tries: 0 }; }
  runImport() {
    const tries = this.state.tries + 1;
    this.setState({ imp: 'loading', tries });
    setTimeout(() => this.setState({ imp: tries === 1 ? 'error' : 'done' }), 900);
  }
  renderVals() {
    const all = [
      ['ES-558201', 'WC-24802', 'YJ22 GRB', 'Eastside TS', '14 Oct 10:47', '26.84 t', '14.10 t', '12.74 t', 'Weighbridge API', 'Valid', 'ok', 'Net matches; vehicle matches job.'],
      ['ES-557930', 'WC-24790', 'YK70 TPR', 'Eastside TS', '14 Oct 08:49', '24.30 t', '17.32 t', '7.42 t', 'Scanned ticket', 'Failed', 'bad', 'Gross − tare = 6.98 t.'],
      ['ES-558118', 'WC-24799', 'YX71 BDZ', 'Eastside TS', '14 Oct 10:12', '17.90 t', '10.95 t', '6.95 t', 'Weighbridge API', 'Valid', 'ok', 'Net matches; vehicle matches job.'],
      ['NW-20931', 'WC-24771', 'C412088', 'Northern EfW Plant', '—', '—', '—', '—', '—', 'Missing', 'bad', 'Ticket not yet received.'],
      ['ES-558090', 'WC-24749', 'YT23 RNA', 'Eastside TS', '14 Oct 07:05', '29.12 t', '15.40 t', '13.72 t', 'Manual entry', 'Pending', 'warn', 'Manual entry awaiting check.'],
      ['ES-557812', 'WC-24741', 'YC20 RCV', 'Eastside TS', '13 Oct 16:44', '21.06 t', '14.88 t', '6.18 t', 'Weighbridge API', 'Valid', 'ok', 'Net matches; vehicle matches job.']
    ];
    const map = { All: null, Valid: 'Valid', Failed: 'Failed', Pending: 'Pending', Missing: 'Missing' };
    const f = this.state.f;
    const st = this.state.imp;
    return {
      imp: { run: () => { if (st !== 'loading') this.runImport(); }, label: st === 'loading' ? 'Importing…' : 'Import from weighbridge', error: st === 'error', done: st === 'done' },
      filters: Object.keys(map).map(x => ({ label: x, on: x === f ? 'true' : 'false', cls: x === f ? 'btn sel' : 'btn', pick: () => this.setState({ f: x }) })),
      rows: all.filter(r => !map[f] || r[9] === map[f]).map(r => ({ ticket: r[0], job: r[1], reg: r[2], fac: r[3], when: r[4], gross: r[5], tare: r[6], net: r[7], src: r[8], result: r[9], cls: r[10], why: r[11] }))
    };
  }
}
</script>
<script>dcBoot({});</script>
